<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>2 技术应用</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "Inter", sans-serif;
        }

        body {
            height: auto;
            min-height: 100vh;
            display: flex;
            transition: margin-left 0.3s ease;
        }

        .sidebar-container {
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            width: 350px;
            transition: all 0.3s ease;
            z-index: 999;
        }

        .sidebar-container.collapsed {
            width: 60px;
        }

        .sidebar {
            width: 100%;
            height: 100vh;
            padding: 40px 20px;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.05);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background-color: #fff;
        }

        .toggle-btn {
            position: absolute;
            right: -15px;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #fff;
            border: 2px solid #e9ecef;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            transition: all 0.2s ease;
        }

        .toggle-btn:hover {
            background-color: #f8f9fa;
            border-color: #007bff;
        }

        .toggle-btn::after {
            content: "←";
            color: #666;
            font-size: 14px;
        }

        .sidebar-container.collapsed .toggle-btn::after {
            content: "→";
        }

        .sidebar-container.collapsed .sidebar {
            padding: 40px 0;
            overflow: hidden;
        }

        .sidebar-container.collapsed .sidebar-item {
            padding: 20px 0;
            text-align: center;
            font-size: 0;
        }

        .sidebar-container.collapsed .sidebar-item::before {
            content: attr(data-num);
            font-size: 18px;
            font-weight: bold;
            color: #fff !important;
            display: block;
        }

        .sidebar-container.collapsed .sidebar-item.home::before {
            content: "🏠";
            color: #2c3e50 !important;
        }

        .sidebar-item {
            padding: 20px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 16px;
            line-height: 1.6;
            color: #fff !important;
            font-weight: 500;
            /* 关键：添加a标签默认样式清除，保证视觉效果一致 */
            text-decoration: none;
            display: block;
        }

        .sidebar-item .en-text {
            font-size: 12px;
            opacity: 0.9;
            display: block;
            margin-top: 4px;
        }

        .sidebar-item:hover {
            opacity: 0.9;
            transform: translateX(2px);
        }

        .sidebar-item.home {
            font-weight: 800;
            font-size: 20px;
            background-color: #f8f9fa;
            color: #2c3e50 !important;
            border-bottom: 3px solid #dee2e6;
            margin-bottom: 15px;
            padding: 25px 15px;
        }

        .sidebar-item.home:hover {
            background-color: #e9ecef;
            color: #007bff !important;
            opacity: 1;
            transform: none;
        }

        .sidebar-item.item-1 {
            background-color: rgb(239, 148, 158);
        }

        .sidebar-item.item-2 {
            background-color: rgb(245, 180, 130);
        }

        .sidebar-item.item-3 {
            background-color: rgb(254, 217, 97);
        }

        .main-content {
            flex: 1;
            margin-left: 350px;
            transition: margin-left 0.3s ease;
            overflow: auto;
            min-height: 100vh;
            pointer-events: auto;
        }

        .sidebar-container.collapsed~.main-content {
            margin-left: 60px;
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: zoom-in;
            overflow: hidden;
        }

        .my-image {
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
            transition: transform 0.15s ease-out;
            transform-origin: center center;
            z-index: 1;
            /* 拖拽时防止图片被选中，优化体验 */
            user-select: none;
        }

        .zoom-tip {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 8px 15px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 12px;
            border-radius: 4px;
            z-index: 99;
        }
    </style>
</head>

<body>
    <div class="sidebar-container" id="sidebarContainer">
        <div class="toggle-btn" id="toggleBtn"></div>
        <div class="sidebar">
            <!-- 核心修改：div改为a标签，添加对应href属性 -->
            <a href="../../../index.html" class="sidebar-item home" data-num="🏠">主页 Home</a>
            <a href="../../1_Bibliometrics/1_Bibliometrics.html" class="sidebar-item item-1" data-num="1">1
                期刊论文总体发表情况<span class="en-text">Bibliometrics</span></a>
            <a href="../../2_Technology/2_Technology.html" class="sidebar-item item-2" data-num="2">2 期刊论文技术应用特点<span
                    class="en-text">Technological Applications</span></a>
            <a href="../../3_In_depth/3_In_depth.html" class="sidebar-item item-3" data-num="3">3 研究深度剖析<span
                    class="en-text">In-depth Systematic Analysis‌</span></a>
        </div>
    </div>

    <!-- 修正图片标签：确保语法完全正确，无多余字符 -->
    <div class="main-content">
        <div class="image-wrapper" id="imageWrapper">
            <img class="my-image" src="3B3.png" alt="主要期刊图片" id="scaleImage">
            <div class="zoom-tip">鼠标滚轮可放大/缩小图片 | 放大后摁住鼠标可拖拽移动</div>
        </div>
    </div>

    <script>
        const sidebarContainer = document.getElementById('sidebarContainer');
        const toggleBtn = document.getElementById('toggleBtn');
        toggleBtn.addEventListener('click', function () {
            sidebarContainer.classList.toggle('collapsed');
        });

        const image = document.getElementById('scaleImage');
        const imageWrapper = document.getElementById('imageWrapper');
        let scale = 1;
        const scaleStep = 0.1;
        const minScale = 0.5;
        const maxScale = 5;

        // ===== 新增：拖拽移动相关状态变量 =====
        let isDragging = false; // 是否正在拖拽
        let startX = 0; // 鼠标按下时的X坐标
        let startY = 0; // 鼠标按下时的Y坐标
        let offsetX = 0; // 图片当前的X偏移量
        let offsetY = 0; // 图片当前的Y偏移量

        // ===== 新增：鼠标按下事件（开启拖拽） =====
        imageWrapper.addEventListener('mousedown', function (e) {
            // 只有图片放大后（scale>1）才允许拖拽
            if (scale <= 1) return;

            isDragging = true;
            // 记录鼠标按下时的初始坐标
            startX = e.clientX;
            startY = e.clientY;
            // 记录图片当前的偏移量（从transform中提取，防止拖拽复位）
            const currentTransform = window.getComputedStyle(image).transform;
            if (currentTransform !== 'none') {
                const matrix = new DOMMatrix(currentTransform);
                offsetX = matrix.e;
                offsetY = matrix.f;
            }
            // 更改鼠标样式，提示正在拖拽
            imageWrapper.style.cursor = 'move';
        });

        // ===== 新增：鼠标移动事件（执行拖拽） =====
        document.addEventListener('mousemove', function (e) {
            // 未开启拖拽时，不执行任何操作
            if (!isDragging) return;

            // 计算鼠标移动的差值（新坐标 - 初始坐标）
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;

            // 更新图片的偏移量
            const newOffsetX = offsetX + dx;
            const newOffsetY = offsetY + dy;

            // 应用变换：先平移（translate）再缩放（scale），保证拖拽体验自然
            image.style.transform = `translate(${newOffsetX}px, ${newOffsetY}px) scale(${scale})`;
        });

        // ===== 新增：鼠标松开/离开事件（关闭拖拽） =====
        document.addEventListener('mouseup', function () {
            endDragging();
        });
        imageWrapper.addEventListener('mouseleave', function () {
            endDragging();
        });
        // 封装关闭拖拽的逻辑
        function endDragging() {
            if (!isDragging) return;
            isDragging = false;
            // 恢复鼠标样式（根据缩放比例判断）
            imageWrapper.style.cursor = scale > 1 ? 'zoom-out' : 'zoom-in';
        }

        // ===== 原有：滚轮缩放功能（轻微修改，适配translate） =====
        imageWrapper.addEventListener('wheel', function (e) {
            e.preventDefault();
            if (e.deltaY < 0) {
                // 向上滚动：放大
                scale = Math.min(scale + scaleStep, maxScale);
            } else {
                // 向下滚动：缩小
                scale = Math.max(scale - scaleStep, minScale);
            }

            // 修改：缩放时保留当前偏移量，防止缩放后图片复位
            const currentTransform = window.getComputedStyle(image).transform;
            let currentOffsetX = 0;
            let currentOffsetY = 0;
            if (currentTransform !== 'none') {
                const matrix = new DOMMatrix(currentTransform);
                currentOffsetX = matrix.e;
                currentOffsetY = matrix.f;
            }

            // 应用变换：平移 + 缩放
            image.style.transform = `translate(${currentOffsetX}px, ${currentOffsetY}px) scale(${scale})`;
            // 更新鼠标样式
            imageWrapper.style.cursor = scale > 1 ? 'zoom-out' : 'zoom-in';
        }, {passive: false});
    </script>
</body>

</html>
